name: Verileri güncelle ve yayınla

# Tek bir iş ~5.5 saat açık kalır ve 6 dakikada bir veriyi yeniler (GitHub'ın zamanlayıcısı 15 dk ayarını
# 30-45 dakikaya geciktirdiği için). Bitince kendini yeniden başlatır; saatlik zamanlama yedek olarak durur.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # gh-pages dalına yayın
  actions: write    # kendini yeniden başlatma

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: futbol-analiz/requirements-build.txt

      - run: pip install -r futbol-analiz/requirements-build.txt

      # Önceki çalıştırmaların önbelleği ve analizleri (değişiklik bildirimleri ve karne için gerekli)
      - uses: actions/cache/restore@v4
        with:
          path: futbol-analiz/data
          key: veri-${{ github.run_id }}
          restore-keys: veri-

      - name: Sürekli güncelle (6 dakikada bir yayın)
        working-directory: futbol-analiz
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          DATA_DIR: data
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GH_TOKEN: ${{ github.token }}
          LOOP_MINUTES: "320"
          PUBLISH_EVERY: "360"
          PLAYER_BUDGET: "150"
        run: bash ../.github/scripts/loop.sh

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: futbol-analiz/data
          key: veri-${{ github.run_id }}

      - name: Kendini yeniden başlat
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run guncelle.yml --repo ${{ github.repository }} --ref main
