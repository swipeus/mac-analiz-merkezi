name: Siteyi yayınla

# guncelle.yml her tur gh-pages dalını yeniler ve bu işi tetikler. Yayın Actions üzerinden yapıldığı için
# GitHub Pages'in saatlik 10 derleme sınırı geçerli olmaz; 3 dakikada bir yayın bu sayede mümkün.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages

      - id: art
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          retention-days: 1

      # Yayın Pages API'siyle elle yapılır: actions/deploy-pages sürüm numarasını her zaman main'in kaydından
      # alıyor; main değişmeden gelen yayınlar aynı numarayı taşıyınca Pages yeni içeriği almadan "başarılı" diyordu.
      # Burada numara gh-pages'in her turda yeni olan kaydıdır.
      - name: Yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.art.outputs.artifact_id }}
        run: |
          set -eu
          VER=$(git rev-parse HEAD)
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" -F artifact_id="$ARTIFACT" -f pages_build_version="$VER" -f oidc_token="$OIDC" --jq .id
          for i in $(seq 1 60); do
            st=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$VER" --jq .status)
            echo "durum: $st"
            case "$st" in
              succeed) exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost|syncing_files_failed) exit 1 ;;
            esac
            sleep 5
          done
          exit 1

      # sitede gerçekten yeni veri var mı: yayındaki meta.json gh-pages'teki ile aynı olmalı; değilse iş kırmızı
      # biter ve GitHub e-postayla haber verir ("başarılı" deyip eski veriyi bırakma hatası bir daha sessiz kalmasın)
      - name: Sitede doğrula
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/meta.json"
          for i in $(seq 1 12); do
            if curl -sf "$URL?t=$(date +%s%N)" | cmp -s - data/meta.json; then echo "sitede yeni veri var"; exit 0; fi
            sleep 10
          done
          echo "::error::Yayın başarılı göründü ama sitedeki veri yenilenmedi"
          exit 1
